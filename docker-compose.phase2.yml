services:
  dbapulse-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbapulse-collector
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DBAPULSE_SOURCE_CONNECTION: ${DBAPULSE_SOURCE_CONNECTION}
      DBAPULSE_MANAGEMENT_CONNECTION: ${DBAPULSE_MANAGEMENT_CONNECTION}
      DBAPULSE_DISPLAY_TIMEZONE: ${DBAPULSE_DISPLAY_TIMEZONE:-Europe/Istanbul}
      DBAPULSE_COLLECTION_INTERVAL_MINUTES: ${DBAPULSE_COLLECTION_INTERVAL_MINUTES:-5}
      DBAPULSE_BASELINE_WINDOW_DAYS: ${DBAPULSE_BASELINE_WINDOW_DAYS:-30}
      DBAPULSE_BASELINE_MIN_DAYS: ${DBAPULSE_BASELINE_MIN_DAYS:-7}
      DBAPULSE_BASELINE_MIN_SAMPLES: ${DBAPULSE_BASELINE_MIN_SAMPLES:-20}
      DBAPULSE_BASELINE_RECALC_INTERVAL_HOURS: ${DBAPULSE_BASELINE_RECALC_INTERVAL_HOURS:-6}
      DBAPULSE_ANOMALY_RESOLVE_AFTER_SECONDS: ${DBAPULSE_ANOMALY_RESOLVE_AFTER_SECONDS:-900}
      DBAPULSE_RUN_ONCE: ${DBAPULSE_RUN_ONCE:-false}
      DBAPULSE_LONG_RUNNING_SECONDS: ${DBAPULSE_LONG_RUNNING_SECONDS:-60}
      DBAPULSE_BLOCKING_WARNING_SECONDS: ${DBAPULSE_BLOCKING_WARNING_SECONDS:-30}
      DBAPULSE_BLOCKING_CRITICAL_SECONDS: ${DBAPULSE_BLOCKING_CRITICAL_SECONDS:-120}
      DBAPULSE_LONGRUNNING_WARNING_SECONDS: ${DBAPULSE_LONGRUNNING_WARNING_SECONDS:-60}
      DBAPULSE_LONGRUNNING_CRITICAL_SECONDS: ${DBAPULSE_LONGRUNNING_CRITICAL_SECONDS:-300}
      DBAPULSE_BLOCKING_RESOLVE_AFTER_SECONDS: ${DBAPULSE_BLOCKING_RESOLVE_AFTER_SECONDS:-180}
      DBAPULSE_LONGRUNNING_RESOLVE_AFTER_SECONDS: ${DBAPULSE_LONGRUNNING_RESOLVE_AFTER_SECONDS:-180}
      DBAPULSE_DEADLOCK_DEFAULT_SEVERITY: ${DBAPULSE_DEADLOCK_DEFAULT_SEVERITY:-Warning}
  dbapulse-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dbapulse-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DBAPULSE_API_CONNECTION: ${DBAPULSE_API_CONNECTION}
      DBAPULSE_DISPLAY_TIMEZONE: ${DBAPULSE_DISPLAY_TIMEZONE:-Europe/Istanbul}
    expose:
      - "8080"
  dbapulse-web:
    build:
      context: ./src/DBAPulse.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: dbapulse-web
    depends_on:
      - dbapulse-api
    ports:
      - "8088:80"
